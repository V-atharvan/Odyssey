# ===========================
# Server Configuration
# ===========================
server.port=${PORT:8080}
spring.application.name=odyssey-backend

# ===========================
# PostgreSQL Database
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/odyssey_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Disable H2 Console as we are not using H2
spring.h2.console.enabled=false

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# ===========================
# JWT Configuration
# ===========================
jwt.secret=${JWT_SECRET:OdysseyJWTSecretKey2024!SuperSecureBase64EncodedStringAtLeast256BitsLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================
# Spring Mail (Gmail SMTP)
# ===========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:v.atharvan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ienfwarfwnldinfa}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===========================
# SpringDoc / Swagger
# ===========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===========================
# CORS
# ===========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://odyssey-kmer.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://[::1]:5173}

# ===========================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
# OAuth2 Configuration
# ===========================
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/oauth2/callback/google
spring.security.oauth2.client.registration.google.scope=profile,email

# GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/api/auth/oauth2/callback/github
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# LinkedIn
spring.security.oauth2.client.registration.linkedin.client-id=${LINKEDIN_CLIENT_ID:YOUR_LINKEDIN_CLIENT_ID}
spring.security.oauth2.client.registration.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:YOUR_LINKEDIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.linkedin.redirect-uri={baseUrl}/api/auth/oauth2/callback/linkedin
spring.security.oauth2.client.registration.linkedin.scope=r_liteprofile,r_emailaddress
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.provider=linkedin

# Provider Details for LinkedIn
spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/me
spring.security.oauth2.client.provider.linkedin.user-name-attribute=id

# App OAuth2 Config
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/success}

# ===========================
# Logging
# ===========================
logging.level.com.odyssey=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===========================
# File Upload
# ===========================
spring.servlet.multipart.max-file-size=10MB
app.file-upload.base-url=${APP_FILE_UPLOAD_BASE_URL:http://localhost:8080/api/files}


# ===========================
# AWS / LocalStack Configuration
# ===========================
aws.access-key=${AWS_ACCESS_KEY:test}
aws.secret-key=${AWS_SECRET_KEY:test}
aws.region=${AWS_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.bucket-name=${AWS_S3_BUCKET:odyssey-uploads}
aws.ses.endpoint=${AWS_SES_ENDPOINT:http://localhost:4566}



# Health check details
management.endpoint.health.show-details=always
management.health.mail.enabled=false
