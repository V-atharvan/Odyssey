# H2 Database configuration for test profile
spring.datasource.url=jdbc:h2:mem:odyssey_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable AWS S3 & Mail during test execution
aws.s3.bucket-name=odyssey-test-bucket
aws.region=us-east-1
spring.mail.host=localhost
spring.mail.port=25
